name: "Discord Funnel"
version: "0.5.2"
slug: "discord_funnel"
description: "Forwards Discord messages to a target webhook or API using configurable Go templates"
url: "https://github.com/azylman/ha-discord-funnel-addon/tree/main/discord_funnel"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
init: false
startup: services
boot: auto
map: []
options:
  discord_token: ""
  target_url: "http://192.168.1.14:8080/api/prompt"
  payload_template: ""
  mentions_only: true
schema:
  discord_token: str
  target_url: url
  payload_template: str?
  mentions_only: bool
